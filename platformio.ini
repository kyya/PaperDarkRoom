; PaperDarkRoom — "A Dark Room" port to the M5PaperS3 (ESP32-S3-R8 + 4.7"
; ED047TC1 540x960 16-grayscale e-ink panel). Standalone firmware built on a
; reusable deep-sleep/BLE/pager skeleton.
;
; Single env, src/ is the whole source tree (no build_src_filter needed).
;
; The board/toolchain and the A/B + big-nvs partition table (partitions.csv)
; are shared with the companion dashboard firmware so tools/ble_ota.py can
; wirelessly cross-flash dashboard <-> game and back — same OTA slot layout +
; same BLE GATT UUID set are the physical prerequisites for that reversible
; cross-flash. See docs/NOTICE.
;
; Build:
;   pio run -e adarkroom                 # compile
;   pio run -e adarkroom -t upload       # flash (USB) — or tools/ble_ota.py to cross-flash
[env:adarkroom]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
; -O2 (PlatformIO defaults to -Os) because the panel driver's per-pixel row
; kernel is the whole performance story and the rendering path is LovyanGFX.
; This used to live only in env:msg-spike, which meant the ONE env that ships
; was the one env not getting it — every timing number in this tree ("~8 ms a
; frame", the scan period the ghost-debt thresholds assume) was measured under
; -O2 and would have been compared against an -Os build on the glass. msg_pie.S
; is assembly and unaffected; everything else here is not.
build_unflags = -Os
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCARD_VERSION="\"0.14.0-adarkroom\""
    -DWAKE_INTERVAL_SECS=900
    -O2
; PINNED, and this is load-bearing rather than housekeeping. The 1bpp bridge
; (src/msg_bridge.cpp) rests on three INTERNAL details of LovyanGFX that no
; public API promises: SpriteBuffer marking an adopted external buffer
; Preallocated so release() will not free MSG's framebuffer; Panel_Sprite's
; rotation-3 transform being exactly (px,py) -> buf(py, 539-px); and
; setBuffer(bpp=0) skipping _write_conv.setColorDepth so the custom ink
; converter survives a re-bind. All three were verified against M5GFX 0.2.25.
; A silent minor bump could inverse the whole UI or transpose it with NO
; compile error, so the version the device was proved on is the version that
; ships — and env:msg-spike below inherits these, so the spike and the firmware
; link the same library rather than drifting apart (they had already drifted to
; 0.2.26/0.2.19 vs 0.2.25/0.2.18 before this was pinned).
lib_deps =
    m5stack/M5Unified @ 0.2.18
    m5stack/M5GFX @ 0.2.25

; Standalone EPD fast-path bench (spike). Same board/toolchain/lib_deps as the
; game, but compiles ONLY src/bench/ — it measures whether Panel_EPD's
; epd_fastest / epd_fast can sustain ~10fps on the 540x960 panel.
;
;   pio run -e bench-epd                 # compile
;   pio run -e bench-epd -t upload       # flash, then: pio device monitor -b 115200
;
; env:adarkroom has no build_src_filter of its own, so it still compiles the
; WHOLE src/ tree — src/bench/bench.cpp included. That file's entire body is
; therefore wrapped in `#ifdef BENCH_EPD`, which only this env defines: under
; env:adarkroom it preprocesses to an empty translation unit and its setup()/
; loop() cannot collide with main.cpp's. That guard is the reason the flag
; below exists; do not drop either half.
[env:bench-epd]
extends = env:adarkroom
build_flags =
    ${env:adarkroom.build_flags}
    -DBENCH_EPD=1
build_src_filter = -<*> +<bench/>

; MSG whole-firmware spike: Wenting Zhang's free-running 1bpp driver (lib/msg,
; MIT, vendored from PaperBar which vendored it from PaperBoy) driving the panel
; at 960x540 instead of M5GFX's Panel_EPD, with this repo's PORTRAIT UI code
; rendering straight into MSG's landscape framebuffer through a rotated 1bpp
; LGFX_Sprite. See src/msg_spike/spike.cpp for what it proves and how.
;
;   pio run -e msg-spike                 # compile
;   pio run -e msg-spike -t upload       # flash, then: pio device monitor -b 115200
;
; -O2 and the pinned M5GFX/M5Unified versions are inherited from env:adarkroom
; now (they moved there when the shipping env turned out to be the only one
; without them). Keeping them in one place is the point: what the spike proves
; on the glass is only evidence for the firmware if the two link the same
; library at the same optimisation level.
;
; build_src_filter compiles the spike PLUS the two UI components under test.
; They are pulled in unmodified and by their real paths precisely because the
; question is whether the game's existing sources work over MSG untouched; a
; copy adapted into src/msg_spike/ would have proved nothing.
;
; env:adarkroom has no build_src_filter and therefore compiles the whole src/
; tree, spike.cpp included — hence the -DMSG_SPIKE=1 guard that file's entire
; body sits behind, exactly as src/bench/bench.cpp does with -DBENCH_EPD=1.
; Do not drop either half.
[env:msg-spike]
extends = env:adarkroom
build_flags =
    ${env:adarkroom.build_flags}
    -DMSG_SPIKE=1
build_src_filter = -<*> +<msg_spike/> +<cjk_text.cpp> +<action_band.cpp>
