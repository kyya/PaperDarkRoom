; PaperDarkRoom — "A Dark Room" port to the M5PaperS3 (ESP32-S3-R8 + 4.7"
; ED047TC1 540x960 16-grayscale e-ink panel). Standalone firmware, split out
; of the dashboard-fw dashboard-firmware repo (which still hosts the reused
; deep-sleep/BLE/pager skeleton this game firmware was built on).
;
; Single env, src/ is the whole source tree (no build_src_filter needed —
; unlike the dashboard-fw monorepo, which multiplexes several firmware targets
; out of sibling src/<target>/ subdirectories).
;
; Shares board/toolchain AND the same A/B + big-nvs partition table
; (partitions.csv, identical layout to dashboard-fw's partitions_ble_nvs.csv) as
; the dashboard-fw dashboard firmware so tools/ble_ota.py can wirelessly
; cross-flash dashboard <-> game and back — same OTA slot layout + same BLE
; GATT UUID set are the physical prerequisites for that reversible
; cross-flash. See docs/research.md §3 and docs/NOTICE.
;
; Build:
;   pio run -e adarkroom                 # compile
;   pio run -e adarkroom -t upload       # flash (USB) — or tools/ble_ota.py to cross-flash
[env:adarkroom]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCARD_VERSION="\"0.1.0-adarkroom\""
    -DWAKE_INTERVAL_SECS=900
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
